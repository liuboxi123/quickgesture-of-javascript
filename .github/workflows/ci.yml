name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Assert build outputs exist
        run: |
          test -f dist/index.esm.js
          test -f dist/index.umd.cjs
          echo "ESM and UMD outputs exist"

      - name: Inspect package contents
        run: npm pack --dry-run