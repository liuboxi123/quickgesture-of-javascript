<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickGesture - Launcher Demo</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000;
    }
    .main{
      width: 100%;
      height: 1600px;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .navbar{
      width: 100%;
      height: 10vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background-color: #000;
      display: flex;
      justify-content: space-between;
    }
    .brand{
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo{
      height: 80%;
      aspect-ratio: 1/1;
      background-image: url(../../resources/img/icon.svg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .name{
      color: white;
      font-size: 2vh;
    }
    .phone{
      width: 100%;
      height: 1600px;
      display: flex;
      justify-content: center;
      align-items: center;

    }
    .nav-item div{
      color: #cfcfcf;
    }
    .nav-item{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .nav-item div:hover{
      color: white;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="navbar">
      <div class="brand">
        <div class="logo">
        </div>
        <div class="name">The QuickGesture of JavaScript</div>
      </div>
      
      <div class="nav-item">
        <div class="git-link name">github</div>
        <div class="doc name">docment</div>
        <div class="home name">home</div>
        <div class="more name">more</div>
      </div>
      
    </div>
    <div class="spacer" style="height: 10vh;"></div>
    <div class="phone">
      <!-- phone -->
      <div id="drag-block">
          <div id="product">
              <div id="desktop">
                  <!-- <qs-grid id="desktop-app-grid" rows="7" gap="30px">
              
                  </qs-grid> -->
              </div>
              
              
              <div id="shade"></div>
              <div id="status-and-nav-view">
                  
                  <div id="top-status-bar">
                      <div id="front-camera"></div>
                      <span id="statusbar-time"></span>
                      <div id="statusbar-info"></div>
                  </div>
                  <div id="center-placeholder"></div>
                  <div id="bottom-nav-bar"></div>
              </div>
              <div id="set-page"></div>
          </div>
      </div>
    </div>
    <div class="bottombar"></div>
  </div>
</body>
    <script src="../js/data.js"></script>
    <script src="../js/productConfig.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/typeEnum.js"></script>
    <script src="../js/index.js"></script>
    <script src="../js/components.js"></script>
    <script>
        const app = document.getElementById('app');
        isShowStatusBar(true);
        // isShowShade(true);
        initInstalledApp(appList);
        openAppListener();
        checkSingleFingerSlideUpwardEvent(bottomNavBar, (e) => {
            // console.log('single finger slide upware');
            // alert('single finger slide upware');
        }, 0.1, true);
       
        setInterval(() => {setStatusBar()}, 1000);

        splitUpwardInBottomNav(runningAppList, bottomNavBar, true);

        gestureListener(statusBar, {
            slowSwipeDown: () => handleStatusBarSlideDown(),
            quickSwipeDown:  () => handleStatusBarSlideDown(),
            slowSwipeUp: () => handleStatusBarSlideUp(),
            quickSwipeUp: () => handleStatusBarSlideUp()
        });
        gestureListener(desktop, {
            slowSwipeLeft: () => {
                console.log('left');
                setDesktopPage('left');
            },
            slowSwipeRight: () => {
                console.log('right');
                setDesktopPage('right');
            },
            quickSwipeLeft: () => {
                console.log('quickSwipeLeft');
                setDesktopPage('left');
            },
            quickSwipeRight: () => {
                console.log('right');
                setDesktopPage('right');
            }
        });
        snackBar('welcome using Quick Gesture', '../packages/apps/MyApp/com/quickStepJs/myApp/res/ic_launcher.svg', product, 'snack-bar', 3000);
        setTimeout(() => {
            noticeBanner(`<div class="banner">
      <img src="../packages/apps/Settings/com/quickStepJs/settings/res/ic_launcher.svg" alt="" width="50px" height="50px">
      <span>Welcome using Quick Gesture os</span>
    </div>`, product, 3000, historyInfo);
        }, 3000);
        setTimeout(() => {
            noticeBanner(`<div class="banner">
      <img src="../packages/apps/Settings/com/quickStepJs/settings/res/ic_launcher.svg" alt="" width="50px" height="50px">
      <span>Quick Gesture is ready</span>
    </div>`, product, 3000, historyInfo);
        }, 4000);
    </script>
</html>
