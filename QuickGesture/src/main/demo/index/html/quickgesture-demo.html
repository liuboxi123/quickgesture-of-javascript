<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickGesture - Launcher Demo</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: white;
    }
    .main{
      width: 100%;
      height: 1600px;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .navbar{
      width: 100%;
      height: 10vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.182);
      backdrop-filter: blur(10px);                 
      -webkit-backdrop-filter: blur(10px); 
      display: flex;
      justify-content: space-between;
    }
    .brand{
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo{
      height: 80%;
      aspect-ratio: 1/1;
      background-image: url(../../resources/img/icon.svg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .name{
      color: rgb(113, 113, 113);
      font-size: 2vh;
    }
    .nav-item div{
      color: #cfcfcf;
    }
    .nav-item{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-left: 5%;
      padding-right: 5%;
    }
    .nav-item div:hover{
      color: rgb(10, 10, 10);
    }
    .components{
      /* width: 100vw; */
      
    }
    .component{
      margin: 10px;
      float: left;
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="navbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="name">The QuickGesture of JavaScript</div>
      </div>
      
      <div class="nav-item">
        <div class="git-link name">Github</div>
        <div class="doc name">Docment</div>
        <div class="home name">Home</div>
        <div class="more name">More</div>
      </div>
      
    </div>
    <div class="spacer" style="height: 10vh;"></div>
    <div class="components">
      <div class="component">
          <qg-app-card fold="true" id="app-card">
            <div slot="icon" id="icon">
              <div id="app-card-icon">
                <h1>Fold card</h1>
              </div>
            </div>
            <div style="padding:20px;height: 100%;">
              <div id="app-card-return-btn">Fold</div>
              <h1 id="title">Unfold Card</h1>
            </div>
          </qg-app-card>
      </div>
      <div class="component">
        <qg-ground-glass id="ground-glass">
          <div>
            <small>Ground glass</small>
          </div>
        </qg-ground-glass>
      </div>
      <div class="component">
        <qg-slider id="slider" value="75">
          <img slot="icon" src="../../resources/img/luminance.svg" alt="">
        </qg-slider>
      </div>
      <div class="component">
        <qg-image-vector src="../../resources/img/example-img.png" id="image-vector"></qg-image-vector>
      </div>
    </div>
    <div class="bottombar"></div>
  </div>
</body>
    <script src="../../../core/index.js"></script>
     <!-- <script src="../js/index.js"></script> -->
    <script src="../js/first-page.js"></script>
    <script type="module" src="../../../core/components.js"></script>
    <script>
      
    </script>
</html>
