<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickGesture - Launcher Demo</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.3px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      color: #a0a0a0;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: #ffffff; }

    .github-link {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a0a0a0 !important;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .github-link:hover {
      color: #ffffff !important;
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
    }

    .github-link svg { width: 18px; height: 18px; fill: currentColor; }

    /* ========== 主内容布局 ========== */
    .main {
      padding-top: 56px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    .page-title {
      text-align: center;
      padding: 40px 20px 20px;
      width: 100%;
    }

    .page-title h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .page-title p {
      font-size: 15px;
      color: #666;
    }

    /* ========== 全屏 iframe 容器 ========== */
    .fullscreen-iframe-wrapper {
      width: 100%;
      flex: 1;
      min-height: 600px;
      height: calc(100vh - 200px); /* 减去标题和底部提示的高度 */
      padding: 0 20px 20px;
      position: relative;
    }

    .fullscreen-iframe-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    /* 底部提示信息 */
    .hint {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      font-size: 13px;
      color: #666;
    }

    .hint svg {
      width: 16px;
      height: 16px;
      fill: #6366f1;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: #333;
      text-align: center;
      padding-bottom: 20px;
    }

    /* ========== 移除手机模型相关样式 ========== */
    .phone-wrapper,
    .phone-frame,
    .phone-screen,
    .screen-placeholder {
      display: none;
    }

    /* ========== 响应式 ========== */
    @media (max-width: 768px) {
      .fullscreen-iframe-wrapper {
        min-height: 400px;
        height: 1600px;
        padding: 0 12px 12px;
      }
      .fullscreen-iframe-wrapper iframe {
        border-radius: 12px;
      }
      .page-title h1 { font-size: 22px; }
      .page-title { padding: 30px 16px 16px; }
    }

    @media (max-width: 480px) {
      .nav-links a:not(.github-link) { display: none; }
      .fullscreen-iframe-wrapper {
        min-height: 300px;
        height: 1600px;
        padding: 0 8px 8px;
      }
      .fullscreen-iframe-wrapper iframe {
        border-radius: 8px;
      }
      .page-title h1 { font-size: 18px; }
      .page-title p { font-size: 13px; }
      .hint { font-size: 12px; padding: 8px 16px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">
      <div class="logo-icon">Q</div>
      <span>QuickGesture</span>
    </a>
    <div class="nav-links">
      <a href="#">Demo</a>
      <a href="#">文档</a>

        <span>GitHub</span>

    </div>
  </nav>

  <main class="main">

        const app = document.getElementById('app');
        isShowStatusBar(true);

        initInstalledApp(appList);
        openAppListener();
        checkSingleFingerSlideUpwardEvent(bottomNavBar, (e) => {
            // console.log('single finger slide upware');
            // alert('single finger slide upware');
        }, 0.1, true);
       
        setInterval(() => {setStatusBar()}, 1000);

        splitUpwardInBottomNav(runningAppList, bottomNavBar, true);

        gestureListener(statusBar, {
            slowSwipeDown: () => handleStatusBarSlideDown(),
            quickSwipeDown:  () => handleStatusBarSlideDown(),
            slowSwipeUp: () => handleStatusBarSlideUp(),
            quickSwipeUp: () => handleStatusBarSlideUp()
        });
        gestureListener(desktop, {

                console.log('left');
                setDesktopPage('left');
            },
            slowSwipeRight: () => {
                console.log('right');
                setDesktopPage('right');
            },
            quickSwipeLeft: () => {
                console.log('quickSwipeLeft');
                setDesktopPage('left');
            },
            quickSwipeRight: () => {

    </div>`, product, 3000, historyInfo);
        }, 3000);
        setTimeout(() => {

      <span>Quick Gesture is ready</span>
    </div>`, product, 3000, historyInfo);
        }, 4000);
    </script>
</html>
